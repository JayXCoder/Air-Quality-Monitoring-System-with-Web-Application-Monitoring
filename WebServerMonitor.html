<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Monitor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <style>
        body {
            background-color: #000000;
            color: #00ffea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background-color: #1e1e2f;
            border: 1px solid #00ffea;
        }
        .card-title {
            color: #00ffff;
        }
        .chart-container {
            background-color: #1e1e2f;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ffea;
            margin-top: 20px;
        }
        .fs-4 {
            color: #ffff33;
        }
        .indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 10px;
        }
        .btn-test-sound {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 text-info">Air Quality Monitor</h1>
            <p class="lead text-secondary">Live data from your Raspberry Pi and Firebase</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body text-center">
                        <h3 class="card-title">Current Readings</h3>
                        <p id="temperature" class="fs-4">Temperature: -- °C</p>
                        <p id="humidity" class="fs-4">Humidity: -- %</p>
                        <p id="air" class="fs-4">Air Quality: -- <span id="air-indicator" class="indicator bg-secondary"></span></p>
                        <button class="btn btn-warning btn-test-sound" onclick="playAlertSound()">Test Alert Sound</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="tempChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="humChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "your-project-id.firebaseapp.com",
                databaseURL: "https://your-project-id-default-rtdb.firebaseio.com",
                projectId: "your-project-id",
                storageBucket: "your-project-id.appspot.com",
                messagingSenderId: "SENDER_ID",
                appId: "APP_ID",
                measurementId: "G-MEASUREMENT_ID"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const analytics = firebase.analytics();
        const db = firebase.database();

        let tempData = [];
        let humData = [];
        let labels = [];

        const dataRef = db.ref('air_monitor');

        const tempChart = new Chart(document.getElementById('tempChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Temperature (°C)',
                    data: tempData,
                    borderColor: '#ff5e00',
                    backgroundColor: 'rgba(255, 94, 0, 0.2)',
                    tension: 0.3
                }]
            },
            options: {
                plugins: {
                    legend: { labels: { color: '#00ffea' } }
                },
                scales: {
                    x: { ticks: { color: '#00ffea' } },
                    y: { ticks: { color: '#00ffea' } }
                }
            }
        });

        const humChart = new Chart(document.getElementById('humChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Humidity (%)',
                    data: humData,
                    borderColor: '#00ffea',
                    backgroundColor: 'rgba(0, 255, 234, 0.2)',
                    tension: 0.3
                }]
            },
            options: {
                plugins: {
                    legend: { labels: { color: '#00ffea' } }
                },
                scales: {
                    x: { ticks: { color: '#00ffea' } },
                    y: { ticks: { color: '#00ffea' } }
                }
            }
        });

        function playAlertSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
            oscillator.stop(audioCtx.currentTime + 1);
        }

        dataRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const now = new Date();
            const label = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const temp = data?.temperature_c;
            const hum = data?.humidity;
            const air = data?.air_quality;

            document.getElementById("temperature").textContent = `Temperature: ${temp ?? '--'} °C`;
            document.getElementById("humidity").textContent = `Humidity: ${hum ?? '--'} %`;
            document.getElementById("air").innerHTML = `Air Quality: ${air ?? '--'} <span id="air-indicator" class="indicator"></span>`;

            const airIndicator = document.getElementById("air-indicator");
            airIndicator.className = 'indicator';

            if (air === "Good") {
                airIndicator.classList.add("bg-success");
            } else if (air === "Moderate") {
                airIndicator.classList.add("bg-warning");
            } else if (air === "Poor") {
                airIndicator.classList.add("bg-danger");
                playAlertSound();
                alert("Unhealthy Air Quality Detected! Please take precautionary measures.");
            } else {
                airIndicator.classList.add("bg-secondary");
            }

            if (temp && hum) {
                if (labels.length > 10) {
                    labels.shift();
                    tempData.shift();
                    humData.shift();
                }
                labels.push(label);
                tempData.push(temp);
                humData.push(hum);
                tempChart.update();
                humChart.update();
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
